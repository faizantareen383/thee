<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | The Resin Art Club</title>
    <meta name="description" content="Complete your order and pay via JazzCash for your handmade resin art purchases." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body data-page="checkout">
    <div id="header"></div>

    <main class="page-hero inner">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">Home</a> / <span>Checkout</span></div>
        <div class="section-heading">
          <div class="eyebrow">Secure Checkout</div>
          <h1>Complete your order</h1>
        </div>
        <div class="cart-layout">
          <div>
            <form id="checkout-form" class="profile-panel">
              <div class="form-grid">
                <div class="form-row"><label>Full Name</label><input class="form-field" name="fullName" required /></div>
                <div class="form-row"><label>Phone</label><input class="form-field" name="phone" required /></div>
                <div class="form-row full"><label>Email</label><input class="form-field" type="email" name="email" required /></div>
                <div class="form-row full"><label>Complete Address</label><input class="form-field" name="address" required /></div>
                <div class="form-row"><label>City</label><input class="form-field" name="city" required /></div>
                <div class="form-row"><label>Province</label><input class="form-field" name="province" required /></div>
                <div class="form-row"><label>Postal Code</label><input class="form-field" name="postalCode" required /></div>
                <div class="form-row"><label>Delivery Instructions</label><input class="form-field" name="instructions" /></div>
              </div>
              <div class="section" style="padding: 20px 0 0;">
                <div class="eyebrow">Payment Method</div>
                <h3>JazzCash</h3>
                <div class="warning-box">This is a frontend-only demo flow for JazzCash integration. No real verification is performed in this static build.</div>
                <div class="form-grid" style="margin-top: 18px;">
                  <div class="form-row"><label>JazzCash Mobile Number</label><input class="form-field" name="jazzCashNumber" required /></div>
                  <div class="form-row"><label>Transaction ID / Reference Number</label><input class="form-field" name="transactionId" required /></div>
                </div>
              </div>
              <input type="hidden" id="checkout-total-hidden" name="total" value="0" />
              <button class="btn btn-primary" type="submit">Submit Payment</button>
            </form>
          </div>
          <div>
            <div class="summary-card">
              <h3>Order Summary</h3>
              <div id="checkout-summary"></div>
              <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">PKR 0</span></div>
              <div class="summary-row"><span>Delivery fee</span><span id="summary-delivery">PKR 0</span></div>
              <div class="summary-row"><span>Discount</span><span id="summary-discount">-PKR 0</span></div>
              <div class="summary-total"><span>Total</span><span id="summary-total">PKR 0</span></div>
              <form id="coupon-form" style="display:grid; gap: 12px; margin-top: 18px;">
                <label>Coupon Code</label>
                <div class="toolbar-actions" style="display:flex; gap:10px;">
                  <input id="coupon-code" class="form-field" placeholder="Enter code" />
                  <button class="btn btn-secondary" type="submit">Apply</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>
    <div id="toast-container"></div>

    <script src="main.js"></script>
    <script src="checkout.js"></script>
  </body>
</html>
